// Waterfall templates (DESIGN.md 9). role: lower = exit pressure >= 0.4 atm, upper = vacuum-optimised.
// referenceDiameter: exit diameter (m) at which the template looks right at scale 1. Calibrate in the
// Waterfall editor on a 1 m nozzle (DESIGN.md 9.4); these are first guesses.
PROCENG_PLUME
{
	propellant = Kerolox
	role = lower
	template = waterfall-kerolox-lower-1
	referenceDiameter = 1.0
}
PROCENG_PLUME
{
	propellant = Kerolox
	role = upper
	template = waterfall-kerolox-upper-1
	referenceDiameter = 1.0
}
