{
	propellant = Methalox
	role = lower
	template = waterfall-methalox-lower-raptor-1
	referenceDiameter = 1.3
}
PROCENG_PLUME
{
	propellant = Methalox
	role = upper
	template = waterfall-methalox-upper-1
	referenceDiameter = 1.0
}
PROCENG_PLUME
{
	propellant = Hydrolox
	role = lower
	template = waterfall-hydrolox-lower-1
	referenceDiameter = 1.0
}
PROCENG_PLUME
{
	propellant = Hydrolox
	role = upper
	template = waterfall-hydrolox-upper-1
	referenceDiameter = 1.0
