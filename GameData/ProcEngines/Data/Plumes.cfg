// Waterfall templates (DESIGN.md 9). role: lower = exit pressure >= 0.4 atm, upper = vacuum-optimised.
// referenceDiameter: exit diameter (m) the template fills at scale 1. Calibrated 2026-10-17 from side-view screenshots
// of each template at scale 1 on a 1.00 m exit nozzle at sea level (tests/ksp/run.sh <A|B> plumes, PHASE3_STATUS.md).
PROCENG_PLUME
{
	propellant = Kerolox
	role = lower
	template = waterfall-kerolox-lower-1
	referenceDiameter = 0.43
}
PROCENG_PLUME
{
	propellant = Kerolox
	role = upper
	template = waterfall-kerolox-upper-1
	referenceDiameter = 0.4
}
PROCENG_PLUME
{
	propellant = Methalox
	role = lower
	template = waterfall-methalox-lower-raptor-1
	referenceDiameter = 1.18
}
PROCENG_PLUME
{
	propellant = Methalox
	role = upper
	template = waterfall-methalox-upper-1
	referenceDiameter = 0.85
}
PROCENG_PLUME
{
	propellant = Hydrolox
	role = lower
	template = waterfall-hydrolox-lower-1
	referenceDiameter = 1.07
}
PROCENG_PLUME
{
	propellant = Hydrolox
	role = upper
	template = waterfall-hydrolox-upper-1
	referenceDiameter = 1.0
}

// Gas-generator turbine exhaust (role = exhaust): attached to the duct nozzle (peGGExhaust), scaled by its exit diameter.
PROCENG_PLUME
{
	propellant = Kerolox
	role = exhaust
	template = waterfall-kerolox-exhaust-1
	referenceDiameter = 0.12
}
PROCENG_PLUME
{
	propellant = Methalox
	role = exhaust
	template = waterfall-methalox-vernier-1
	referenceDiameter = 0.08
}
PROCENG_PLUME
{
	propellant = Hydrolox
	role = exhaust
	template = waterfall-hydrolox-upper-1
	referenceDiameter = 1.0
}
