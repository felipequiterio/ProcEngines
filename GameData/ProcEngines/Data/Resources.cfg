// KSP resources burned per propellant, in tank unit ratios (DESIGN.md 4.1). Thermochemistry uses the real
// mixture ratio; the engine draws at the tank preset ratio so every existing tank stays balanced.
PROCENG_RESOURCES
{
	propellant = Kerolox
	PROPELLANT
	{
		name = LiquidFuel
		ratio = 0.9
		DrawGauge = True
	}
	PROPELLANT
	{
		name = Oxidizer
		ratio = 1.1
	}
}
PROCENG_RESOURCES
{
	propellant = Methalox
	// CryoTanks LMOx 1.875 : 0.625
	PROPELLANT
	{
		name = LqdMethane
		ratio = 3
		DrawGauge = True
	}
	PROPELLANT
	{
		name = Oxidizer
		ratio = 1
	}
}
PROCENG_RESOURCES
{
	propellant = Hydrolox
	// CryoTanks LH2O 4.995 : 0.333
	PROPELLANT
	{
		name = LqdHydrogen
		ratio = 15
		DrawGauge = True
	}
	PROPELLANT
	{
		name = Oxidizer
		ratio = 1
	}
}

