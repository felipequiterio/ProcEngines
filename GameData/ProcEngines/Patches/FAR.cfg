// FAR voxelises the procedural engine from its colliders (three convex frustums from the mount plate to the exit,
// rebuilt with every design change), never from the render meshes. Without this FAR picks colliders or meshes per
// design by comparing their bounds, and on the mesh path it would read both levels of detail and the visual-only kit.
// It also lets flight meshes drop their CPU copies (ModuleProcEngine.ReleaseCpuCopies). Same as FAR's own
// override for procedural tanks (FARVoxelGeometryOverrides.cfg).
@PART[procEngine-liquid]:NEEDS[FerramAerospaceResearch]:AFTER[FerramAerospaceResearch]
{
	@MODULE[GeometryPartModule]
	{
		%forceUseColliders = True
	}
}
