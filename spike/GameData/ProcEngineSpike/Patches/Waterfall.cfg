// Empty Waterfall module; the spike adds a scaled template at runtime (check 5).
@PART[procEngineSpike]:NEEDS[Waterfall]
{
	MODULE
	{
		name = ModuleWaterfallFX
		moduleID = procEngine
		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}
		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
			engineID = procEngine
			responseRateUp = 0.05
			responseRateDown = 0.1
		}
		CONTROLLER
		{
			name = random
			linkedTo = random
			noiseType = perlin
			scale = 1
			speed = 2
			seed = 3
		}
	}
}
